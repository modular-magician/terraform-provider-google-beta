resource: google_secret_manager_secret_version
generation_type: mmv1
source_file: products/secretmanager/SecretVersion.yaml
api_service_name: secretmanager.googleapis.com
api_version: v1
api_resource_type_kind: SecretVersion
cai_asset_name_formats:
    - //secretmanager.googleapis.com/{{secret}}/versions/{{version}}
api_variant_patterns:
    - projects/{project}/secrets/{secret}/versions/{version}
fields:
    - api_field: createTime
    - api_field: destroyTime
    - api_field: state
      field: enabled
    - field: is_secret_data_base64
      provider_only: true
    - api_field: name
    - api_field: project
    - api_field: secret
    - api_field: payload.data
      field: secret_data
    - api_field: payload.data
      field: secret_data_wo
    - api_field: payload.SecretDataWoVersion
      field: secret_data_wo_version
    - api_field: version
    - field: deletion_policy
      provider_only: true
